# Copy this file to config.yaml and edit the repo list below.
# Add or remove repos any time -- no code changes needed.

repos:
  - owner: mlflow
    name: mlflow
  - owner: kubeflow
    name: pipelines
  - owner: deepchem
    name: deepchem
  - owner: eellak
    name: spdx-storage
  - owner: fossasia
    name: eventyay
  - owner: future-agi
    name: future-agi

filters:
  # Only alert on issues open for at least this many hours (skip brand-new issues
  # people haven't had a chance to claim yet). Set to 0 to disable.
  min_age_hours: 24

  # Ignore issues older than this many days (e.g., 30, 60, or 90). Set to 0 to disable.
  max_age_days: 60

  # Skip issues that have any of these labels (case-insensitive).
  exclude_labels:
    - "blocked"
    - "wontfix"
    - "duplicate"
    - "needs-triage"

  # Only include issues that have at least one of these labels.
  # Leave empty to include all labels.
  include_labels: []

  # Re-notify about an issue if it's still unclaimed after this many days
  # since it was first reported to you (0 = never re-notify, only once ever).
  renotify_after_days: 7

  # If true, draft PRs will NOT count as claiming an issue.
  ignore_draft_prs: false

  # Only alert on issues with zero comments (true) or max N comments (e.g. 2).
  # uncommented_only: false
  # max_comments: 2

# Sort matched issues before notifying: created, reactions (most upvotes), comments, oldest
sort_by: created

# Max number of issues to check per repo per GraphQL page (max 100).
page_size: 50

